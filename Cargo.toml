[package]
name = "agent-delegation"
version = "0.2.0"
edition = "2024"
description = "Delegate through VS Code Agent Host, Claude Code, or Google Antigravity"
repository = "https://github.com/wycats/agent-delegation"
publish = false

[dependencies]
ahp = "=1.0.0"
ahp-types = "=1.0.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
