[package]
name = "agent-delegation"
version = "0.3.1"
edition = "2024"
description = "Delegate through VS Code Agent Host, Claude Code, or Google Antigravity"
repository = "https://github.com/wycats/agent-delegation"
publish = false

[dependencies]
ahp = "=1.0.0"
ahp-types = "=1.0.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }
base64 = "0.22"
sha2 = "0.10"
url = "2"
tempfile = "3"
cap-std = "4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
