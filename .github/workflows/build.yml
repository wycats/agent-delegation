name: Binary builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  settings-assets:
    name: Build settings UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-assets
          path: ui/build/
          if-no-files-found: error

  build:
    needs: settings-assets
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: settings-assets
          path: ui/build
      - run: node --test --test-timeout=90000 providers/claude/runner.test.mjs providers/google/runner.test.mjs
      - run: cargo test --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Install browser for the settings acceptance test
        if: runner.os == 'Linux'
        working-directory: ui
        run: |
          npm ci
          npm exec -- playwright install --with-deps --only-shell chromium
      - name: Rename a saved AHP target in Chromium and check it through the CLI
        if: runner.os == 'Linux'
        run: cargo test --locked --release --target ${{ matrix.target }} --test assignments settings_renames_saved_ahp_target_without_rebinding_it -- --exact --ignored
      - name: Check and package the Unix executable
        if: runner.os != 'Windows'
        working-directory: target/${{ matrix.target }}/release
        run: |
          ./agent-delegation --help
          ./agent-delegation ahp --help | grep -F 'ahp submit'
          node "$GITHUB_WORKSPACE/tests/settings-smoke.mjs" ./agent-delegation
          tar -czf "$GITHUB_WORKSPACE/agent-delegation-${{ matrix.platform }}.tar.gz" agent-delegation
      - name: Check and package the Windows executable
        if: runner.os == 'Windows'
        working-directory: target/${{ matrix.target }}/release
        run: |
          .\agent-delegation.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node "$env:GITHUB_WORKSPACE/tests/settings-smoke.mjs" .\agent-delegation.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path agent-delegation.exe -DestinationPath "$env:GITHUB_WORKSPACE/agent-delegation-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-delegation-${{ matrix.platform }}
          path: agent-delegation-${{ matrix.platform }}.*
          if-no-files-found: error

  release-version:
    name: Check release version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          package_version() {
            git show "$1:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])'
          }
          version=$(package_version HEAD)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            git merge-base --is-ancestor HEAD origin/main
          else
            previous=$(package_version "$BEFORE")
            if [[ "$version" == "$previous" ]]; then exit 0; fi
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  release:
    name: Publish release
    needs: [build, release-version]
    if: needs.release-version.outputs.tag != ''
    runs-on: ubuntu-latest
    concurrency: publish-${{ needs.release-version.outputs.tag }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-delegation-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        working-directory: dist
        run: |
          archives=(agent-delegation-macos-{arm64,x64}.tar.gz agent-delegation-windows-x64.zip agent-delegation-linux-x64.tar.gz)
          sha256sum "${archives[@]}" > SHA256SUMS
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then exit 0; fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" "${archives[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
