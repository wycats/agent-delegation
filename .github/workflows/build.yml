name: Binary builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test --test-timeout=90000 providers/claude/runner.test.mjs providers/google/runner.test.mjs
      - run: cargo test --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check and package the Unix executable
        if: runner.os != 'Windows'
        working-directory: target/${{ matrix.target }}/release
        run: |
          ./agent-delegation --help
          tar -czf "$GITHUB_WORKSPACE/agent-delegation-${{ matrix.platform }}.tar.gz" agent-delegation
      - name: Check and package the Windows executable
        if: runner.os == 'Windows'
        working-directory: target/${{ matrix.target }}/release
        run: |
          .\agent-delegation.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path agent-delegation.exe -DestinationPath "$env:GITHUB_WORKSPACE/agent-delegation-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-delegation-${{ matrix.platform }}
          path: agent-delegation-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged version and commit
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-delegation-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archives=(agent-delegation-macos-{arm64,x64}.tar.gz agent-delegation-windows-x64.zip agent-delegation-linux-x64.tar.gz)
          sha256sum "${archives[@]}" > SHA256SUMS
          gh release create "$TAG" "${archives[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
